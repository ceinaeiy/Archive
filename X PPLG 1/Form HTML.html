<!doctype html>
<html>
  <head>
    <title>TUGAS WEBSITE</title>
  </head>
 <body>
   <style>
   input {
     background-color: #d3d3d3;
   }
   select {
     background-color: #d3d3d3;
   }
   textarea {
     background-color: #d3d3d3;
   }
   </style>
  <fieldset>
  <legend><h1>Form HTML</h1></legend>
  <table>
  <tr>
  <td>Nama</td>
  <td>=</td>
  <td><input type="name" name="nama" placeholder="Nama..." ></td>
  </tr>
    <tr>
  <td>Username</td>
  <td>=</td>
  <td><input type="name" name="username" placeholder="Username..." ></td></tr>
  <tr>
  <td>Email</td>
  <td>=</td>
  <td><input type="email" name="email" placeholder="Email...." required></td></tr>
  <tr>
  <td>Tempat Tanggal Lahir</td>
  <td>=</td>
  <td><input type="Tempat" name="tempat" required>
  <input type="date" name="tanggal"></td>
  <tr>
  <td>Agama</td>
  <td>=</td>
  <td><select name="agama">
  <option value="islam">Islam</option>
  <option value="kristen">Kristen</option>
  <option value="katolik">Katolik</option>
  <option value="hindu">Hindu</option>
  <option value="budha">Budha</option>
  </tr>
  <tr>
  <td>Kota</td>
  <td>=</td>
  <td><select name="kota">
  <option value="semarang">Semarang</option>
  <option value="kendal">Kendal</option>
  <option value="Kaliwungu">Kaliwungu</option>
  <option value="kudus">Kudus</option>
  <option value="demak">Demak</option>
  
  </tr>
   <tr>
  <td>Biografi</td>
  <td>=</td>
  <td><textarea name="komentar" rows="4" cols="50" placeholder="Biografi..."></textarea></td></tr>
    <tr>
      <td><input type="submit" name="submit" value="Input"></td>
    </tr>
  </table>
  </fieldset>
 </body>
</html>
